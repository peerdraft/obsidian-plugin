name: Release with Attestation

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine if this is a pre-release based on tag name
          if [[ "${{ github.ref_name }}" =~ -(alpha|beta|rc)\. ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          
          gh release create ${{ github.ref_name }} \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            -t "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG
